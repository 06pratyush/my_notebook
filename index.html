<!DOCTYPE html>
<!--
================================================================================
SYSTEM PROMPT — Ultimate Notebook Folio
================================================================================
WHAT THIS PROJECT IS:
The Ultimate Notebook Folio is a digital commonplace book — a single, never-sorted
running notebook that holds everything its keeper knows, longs to know, or refuses
to forget. It is a Zettelkasten made digital: passages instead of cards, a tap
instead of a number pencilled in the margin, and whatever is linked reachable at
once — one long book in place of a wooden cabinet.

CORE PHILOSOPHY:
- Never file anything. Write at the back of the tablet unsorted. The machine
  decides where a passage lives and binds each passage to the others it touches.
- The keeper files without complaint or fatigue; the human never sorts.
- One rule: never file — the relief that kills the friction that kills the thought.

PASSAGE STATUSES:
- OWNED (■): sealed and dated; passed the trial; may decay and be summoned back.
- HELD (□): awaiting the trial; may be merely held or a Living Work in progress.
- A LIVING WORK (◧): a passage actively being written/refined.
- SPARK (◇): caught in passing; a seed that may grow into a full passage.
- AN OPEN QUESTION (◌): unanswered; the keeper wrestles with it.

THE TRIAL:
Between merely HELD and truly OWNED stands the trial. Protocol:
1. The keeper explains the passage from memory in words a bright 12-year-old
   would follow. No jargon, no borrowing.
2. The examiner picks ONE plain but load-bearing word the keeper used (like
   "random", "energy", "order") and asks them to open it — unfold what lies
   behind it, going one layer deeper if the answer hides emptiness.
3. Drill at most 3 words total, one per turn. Judge sternly but fairly:
   vagueness, circularity, or borrowed phrases that cannot be unpacked = a crack.
   Real, plain, correct understanding = pass.
4. The verdict seals the passage or records the crack.
5. A passage may require a drawn diagram as half the trial (Draw It or You
   Don't Own It).

DECAY DOCTRINE:
Knowledge rusts. Every owned passage is summoned back to the threshold after
DECAY_DAYS (default 180). The keeper re-earns ownership or the seal falls and
the passage reverts to merely held. Ownership is a tribute paid over and over,
never a deed signed once.

KEY VISUALIZATION OVERLAYS:
1. ATLAS — A force-directed physics graph. Each passage is a node; bindings are
   edges. Nodes can be dragged; the web follows. Hover to see kin; click to leap.
2. ORRERY — Passages orbit by standing: owned circles the heart, open questions
   drift at the rim. Bodies orbit at different speeds by category.
3. CHRONICLE — A weekly almanac. Passages are placed on a timeline by entry date,
   seal date, and due date. 52 weeks per year, grouped into 4 seasons.
4. CALENDAR — A 4x3 month grid (year view). Ink density shows activity per day.
   Year picker in header. Tooltip shows events.
5. SUMMONS — Lists owned passages and their seal status; overdue passages demand
   re-trial.
6. TREE — A cherry-blossom tree where domains are boughs, passages are blossoms,
   owned = bloomed, held = buds, sparks = closed buds, questions = dashed roots.
7. HEART — An anatomical cross-section of the human heart with labeled chambers,
   valves, and conducting system. Arteries in forward hatch, veins in back hatch.

DESIGN PRINCIPLES:
- Serif typography (IM Fell English / IM Fell English SC) on parchment (#fcfbf7).
- Monochrome palette: ink (#16150f) on parchment. Accent #6b675a, #3a382e.
- Borders: 1.5px solid ink. Shadow: 10px 10px 0 rgba(22,21,15,.2).
- Word drilling: technical terms in prose are underlined and show pop-up definitions.
- Reveal animations on scroll, rail navigation on the right edge.
- Print-friendly: overlays hidden, reveals forced visible.

SVG ICONS:
- Owned: filled circle with star.
- Held: open hexagonal badge with spine lines.
- Living Work: half-filled circle (vertical split).
- Spark: 4-point star with center hole.
- Open Question: eye/magnifier with three tick marks.

TECHNICAL ARCHITECTURE:
- Single HTML file, all CSS and JS inline.
- State persisted in localStorage (passage status, seals, cracks).
- The examiner uses the Claude API (window.claude.complete) for the trial.
- No external dependencies beyond Google Fonts.

MAINTENANCE NOTES:
- To add a passage: add to PASSAGES array with id, title, status, tags, date, links.
- Links reference passage IDs; bidirectional linking is computed automatically.
- To change decay period: adjust DECAY_DAYS constant (default 180).
- The file is designed to work as a GitHub Pages site (index.html in root).
================================================================================
-->
