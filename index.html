<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Ultimate Notebook</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <!-- Diagrams -->
  <script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/notebook.css">
</head>
<body>

  <!-- ============================ TOOLBAR ============================ -->
  <div id="fl-toolbar">
    <div id="fl-notebooks" class="fl-notebooks"></div>
    <input id="fl-search" type="text" placeholder="Search the book…">
    <div style="display: flex; flex-wrap: wrap; gap: 6px;">
      <button id="fbtn-atlas" class="fl-btn">✳ Atlas</button>
      <button id="fbtn-orrery" class="fl-btn">◉ Orrery</button>
      <button id="fbtn-chron" class="fl-btn">Chronicle</button>
      <button id="fbtn-cal" class="fl-btn">▦ Calendar</button>
      <button id="fbtn-ai" class="fl-btn" title="Ask the notebook">✦ AI</button>
      <button id="fbtn-edit" class="fl-btn" title="Admin login">✎ Edit</button>
      <button id="fbtn-bind" class="fl-btn">Bind ⤓</button>
    </div>
  </div>

  <!-- ============================ RAIL ============================ -->
  <div id="fl-rail"></div>

  <!-- ============================ OVERLAYS ============================ -->
  <div id="fl-atlas" class="fl-overlay"></div>
  <div id="fl-orrery" class="fl-overlay"></div>
  <div id="fl-chron" class="fl-overlay"></div>
  <div id="fl-cal" class="fl-overlay"></div>
  <div id="fl-bind" class="fl-overlay"></div>

  <!-- ============================ AI SIDE PANEL ============================ -->
  <aside id="fl-ai"></aside>

  <!-- ============================ LOGIN MODAL ============================ -->
  <div id="fl-login">
    <div class="login-card">
      <h3>Admin Login</h3>
      <p style="font-size: 15px; color: #6b675a; margin: 0 0 16px; line-height: 1.5;">Enter a GitHub Personal Access Token with <code>repo</code> scope. Only <strong>06pratyush</strong> account is authorised.</p>
      <div id="fl-login-error" class="login-error" style="display: none;"></div>
      <input id="fl-login-token" type="password" placeholder="ghp_xxxxxxxxxxxx">
      <div class="login-btns">
        <button id="fl-login-cancel" class="fl-btn">Cancel</button>
        <button id="fl-login-submit" class="fl-btn solid">Login</button>
      </div>
    </div>
  </div>

  <!-- ============================ MAIN CONTENT ============================ -->
  <div id="fl-content" style="background: #fcfbf7; color: #16150f; font-family: 'IM Fell English', Georgia, serif;">
    <!-- Components and passages are loaded here by JS -->
  </div>

  <!-- ============================ SCRIPTS ============================ -->
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/search.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/notebooks.js"></script>
  <script src="js/passages.js"></script>
  <script src="js/overlays/atlas.js"></script>
  <script src="js/overlays/orrery.js"></script>
  <script src="js/overlays/chronicle.js"></script>
  <script src="js/overlays/calendar.js"></script>
  <script src="js/overlays/bind.js"></script>
  <script src="js/ollama.js"></script>
  <script src="js/ai-panel.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
